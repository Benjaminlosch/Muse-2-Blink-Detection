[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcihand"
version = "0.1.0"
description = "Muse 2 blink-controlled prosthetic hand: real-time blink detection pipeline"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "pyserial>=3.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
acquisition = ["brainflow>=5.10.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
