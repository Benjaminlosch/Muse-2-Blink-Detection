; PlatformIO project for the ESP32 firmware. See docs/ESP32_SETUP.md.
;
; Two real build targets against the actual ESP32 toolchain (Xtensa GCC +
; arduino-esp32 framework, both verified to compile in this repository's
; development environment — neither has been flashed to or run on physical
; hardware yet: WAITING FOR HARDWARE VERIFICATION):
;
;   pio run -e esp32dev             Mode A: PC/browser does acquisition +
;                                    detection, ESP32 is a serial-driven
;                                    safety receiver + motor controller.
;                                    This is the most-verified path.
;
;   pio run -e esp32dev_standalone  Mode B: ESP32 connects directly to the
;                                    Muse 2 over BLE and runs the full
;                                    detection pipeline itself — no PC/
;                                    browser at runtime. Calibrate on the
;                                    web app first (Calibration page ->
;                                    "Export ESP32 Config"), drop the
;                                    result into lib/core/pipeline_config.h,
;                                    then build this target.
;
; NimBLE-Arduino (h2zero/NimBLE-Arduino, actively maintained, verified
; before adding — see docs/ESP32_SETUP.md "Mode B") is only declared as a
; dependency for esp32dev_standalone, so the Mode A build doesn't pay for
; a BLE stack it never uses.
;
; [env:native] is scaffolding for host-side unit tests of the
; hardware-independent logic in lib/core/ (safety_state_machine,
; command_parser, dsp, blink_pipeline, ...) via `pio test -e native`. It
; requires a host C/C++ compiler (e.g. gcc/g++ or MSVC) that was NOT
; available in the environment this was written in — see
; test/test_native/ and docs/TESTING.md.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; -Iinclude: PlatformIO's LDF does not automatically add the project
; include/ directory to library (lib/core/*.cpp) compilation units, only to
; src/*.cpp — command_parser.cpp needs include/protocol.h, so make the path
; explicit rather than relying on LDF include-scoping quirks.
build_flags = -Iinclude

[env:esp32dev]
; Alternate hardware configuration (see include/config.h): uncomment to
; build for the single-pin servo variant instead of the default DC
; H-bridge configuration.
; build_flags = ${env.build_flags} -D MOTOR_MODE_SERVO=1

[env:esp32dev_standalone]
build_flags = ${env.build_flags} -D OPERATING_MODE_STANDALONE=1
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Ilib/core -Iinclude
