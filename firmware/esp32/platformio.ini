; PlatformIO project for the Mode A ESP32 safety receiver / motor
; controller (project brief sections 12/13). See docs/ESP32_SETUP.md.
;
; [env:esp32dev] is the real target: builds against the actual ESP32
; toolchain PlatformIO downloads (Xtensa GCC + arduino-esp32 framework).
; This build has been verified to compile in this repository's development
; environment; it has NOT been flashed to or run on physical hardware —
; WAITING FOR HARDWARE VERIFICATION.
;
; [env:native] is scaffolding for host-side unit tests of the
; hardware-independent logic in lib/core/ (safety_state_machine,
; command_parser, dsp) via `pio test -e native`. It requires a host C/C++
; compiler (e.g. gcc/g++ or MSVC) that was NOT available in the environment
; this was written in — see test/test_native/README.md and docs/TESTING.md.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; -Iinclude: PlatformIO's LDF does not automatically add the project
; include/ directory to library (lib/core/*.cpp) compilation units, only to
; src/*.cpp — command_parser.cpp needs include/protocol.h, so make the path
; explicit rather than relying on LDF include-scoping quirks.
build_flags = -Iinclude
; Alternate hardware configuration (see include/config.h): uncomment to
; build for the single-pin servo variant instead of the default DC
; H-bridge configuration.
; build_flags = -Iinclude -D MOTOR_MODE_SERVO=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Ilib/core -Iinclude
